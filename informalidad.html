<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kiosco Transmilenio</title>

    <link rel="stylesheet" href="estiloInformalidad.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Press+Start+2P&family=Space+Mono:wght@400;700&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <!-- TÍTULO -->
    <div class="titulo-contenedor">
        <div class="titulo-pista">

            <span>ESTACIÓN: INFORMALIDAD ★</span>
            <span>ESTACIÓN: INFORMALIDAD ★</span>
            <span>ESTACIÓN: INFORMALIDAD ★</span>

        </div>
    </div>


    <!-- KIOSCO LARGO -->
    <main class="kiosco">

        <!-- TÍTULO -->
        <div class="kiosco-titulo">
            Kiosco Transmilenio
        </div>


        <!-- PRODUCTOS -->
        <div class="productos">

            <img
                src="assets/nanos.png"
                class="producto nanos"
                alt="Nanos"
            >

            <img
                src="assets/menta.png"
                class="producto menta"
                alt="Menta"
            >

            <img
                src="assets/cafe.png"
                class="producto cafe"
                alt="Café"
            >

            <img
                src="assets/nucita.png"
                class="producto nucita"
                alt="Nucita"
            >

            <img
                src="assets/moritas.png"
                class="producto moritas"
                alt="Moritas"
            >

            <img
                src="assets/gomitas.png"
                class="producto gomitas"
                alt="Gomitas"
            >

            <img
                src="assets/bombon.png"
                class="producto bombon"
                alt="Bombón"
            >

            <img
                src="assets/sparkies.png"
                class="producto sparkies"
                alt="Sparkies"
            >

            <img
                src="assets/anis.png"
                class="producto anis"
                alt="Anís"
            >

        </div>

        <p class="mensaje-informalidad">
            La venta informal dentro del sistema está prohibida por las normas de TransMilenio.
            Pero ¿cómo ignorar la realidad económica de quienes viven en la informalidad?
            Seamos amables.
        </p>

    </main>


    <!-- VOLVER AL BUS -->
    <a href="index.html" class="volver">
        ← VOLVER AL BUS
    </a>

</body>
</html>
