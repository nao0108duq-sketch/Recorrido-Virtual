<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Intolerancia</title>

    <link rel="stylesheet" href="estiloIntolerancia.css">

    <!-- Tipografías -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <audio id="sonido-intolerancia" autoplay loop>
        <source src="assets/lo%20que%20no%20hay%20son%20asientos.mp3" type="audio/mpeg">
        Tu navegador no admite la reproducción de audio.
    </audio>
    <script>
        const sonidoIntolerancia = document.getElementById("sonido-intolerancia");

        sonidoIntolerancia.play().catch((error) => {
            console.info("El navegador iniciará el sonido después de una interacción.", error);

            const reintentarSonido = () => {
                sonidoIntolerancia.play().then(() => {
                    document.removeEventListener("pointerdown", reintentarSonido);
                    document.removeEventListener("keydown", reintentarSonido);
                }).catch((error) => {
                    console.error("No se pudo reproducir el sonido de intolerancia.", error);
                });
            };

            document.addEventListener("pointerdown", reintentarSonido);
            document.addEventListener("keydown", reintentarSonido);
        });
    </script>

    <!-- IMAGEN DE FONDO -->
    <img
        src="assets/busfondo.jpg"
        alt=""
        class="fondo"
    >


    <!-- CAPA SOBRE LA IMAGEN -->
    <div class="capa"></div>


    <!-- TITULO EN MOVIMIENTO -->
    <div class="titulo-contenedor" aria-label="ESTACION: INTOLERANCIA">
        <div class="titulo-pista" aria-hidden="true">
            <span>ESTACION: INTOLERANCIA ✦</span>
            <span>ESTACION: INTOLERANCIA ✦</span>
            <span>ESTACION: INTOLERANCIA ✦</span>
        </div>
    </div>


    <!-- FRASE CENTRAL -->
    <main class="contenido">

        <h1>
            Me encanta subir a Transmilenio,
            la transición entre transmi y la muerte
            es casi imperceptible
        </h1>

    </main>
