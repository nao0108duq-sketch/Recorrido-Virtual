<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>En TransMilenio pasan cosas buenas</title>

    <link rel="stylesheet" href="estilo.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
        rel="stylesheet"
    >
</head>

<body>
    <audio id="sonido-principal" autoplay loop>
        <source src="assets/Sonido.mp3" type="audio/mpeg">
        Tu navegador no admite la reproducción de audio.
    </audio>
    <script>
        const sonidoPrincipal = document.getElementById("sonido-principal");

        sonidoPrincipal.play().catch((error) => {
            console.info("El navegador iniciará el sonido después de una interacción.", error);

            const reintentarSonido = () => {
                sonidoPrincipal.play().then(() => {
                    document.removeEventListener("pointerdown", reintentarSonido);
                    document.removeEventListener("keydown", reintentarSonido);
                }).catch((error) => {
                    console.error("No se pudo reproducir el sonido principal.", error);
                });
            };

            document.addEventListener("pointerdown", reintentarSonido);
            document.addEventListener("keydown", reintentarSonido);
        });
    </script>

    <!-- TÍTULO -->
    <div class="titulo-contenedor">

        <div class="titulo-pista">
            <span>EN TRANSMILENIO PASAN COSAS BUENAS ★</span>
            <span>EN TRANSMILENIO PASAN COSAS BUENAS ★</span>
            <span>EN TRANSMILENIO PASAN COSAS BUENAS ★</span>
        </div>

    </div>


    <!-- BUS -->

        <div class="bus-contenedor">

            <!-- Imagen del bus sin los cinco personajes principales -->
            <img
                src="assets/imagencompleta.png"
                class="bus-fondo"
                alt="Interior de TransMilenio"
            >


            <!-- PASAJERO 1: SENTADO AZUL -->
            <a href="trancones.html" class="pasajero pasajero1">

                <img
                    src="assets/pasajero3.png"
                    alt="Pasajero sentado"
                >

                <div class="pensamiento">
                    "Otra vez voy
                    a llegar tarde."
                </div>

            </a>


            <!-- PASAJERO 2: BRAZO LEVANTADO -->
            <a href="intolerancia.html" class="pasajero pasajero2">

                <img
                    src="assets/pasajero5.png"
                    alt="Pasajero de pie"
                >

                <div class="pensamiento">
                    "¿Por qué todos
                    están tan molestos?"
                </div>

            </a>


            <!-- PASAJERO 3: MUJER AMARILLA -->

            <!-- PASAJERO 5: VENDEDOR -->

                </div>

            </a>

        </div>

    </main>

</body>
